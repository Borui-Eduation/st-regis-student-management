version: '3.8'

services:
  # Next.js Web 应用
  web:
    build:
      context: ./WEB_APP
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_DATABASE_ID: ${NEXT_PUBLIC_FIREBASE_DATABASE_ID}
        # 构建时也需要 Firebase 凭据用于页面预渲染
        FIREBASE_ADMIN_PROJECT_ID: ${FIREBASE_ADMIN_PROJECT_ID}
        FIREBASE_ADMIN_CLIENT_EMAIL: ${FIREBASE_ADMIN_CLIENT_EMAIL}
        FIREBASE_ADMIN_PRIVATE_KEY: ${FIREBASE_ADMIN_PRIVATE_KEY}
        FIREBASE_ADMIN_DATABASE_ID: ${FIREBASE_ADMIN_DATABASE_ID}
    container_name: stregis-webapp
    restart: unless-stopped
    env_file:
      - ./WEB_APP/.env
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      
      # Firebase Admin SDK
      FIREBASE_ADMIN_PROJECT_ID: ${FIREBASE_ADMIN_PROJECT_ID}
      FIREBASE_ADMIN_CLIENT_EMAIL: ${FIREBASE_ADMIN_CLIENT_EMAIL}
      FIREBASE_ADMIN_PRIVATE_KEY: ${FIREBASE_ADMIN_PRIVATE_KEY}
      FIREBASE_ADMIN_DATABASE_ID: ${FIREBASE_ADMIN_DATABASE_ID}
      
      # Firebase Client (公开)
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      NEXT_PUBLIC_FIREBASE_DATABASE_ID: ${NEXT_PUBLIC_FIREBASE_DATABASE_ID}
      
      # NextAuth
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      
      # Resend Email
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      
      # Upstash Redis
      KV_REST_API_URL: ${KV_REST_API_URL}
      KV_REST_API_TOKEN: ${KV_REST_API_TOKEN}
    networks:
      - stregis-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  stregis-network:
    driver: bridge
